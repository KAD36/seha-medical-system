services:
  - type: web
    name: seha-medical-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_combined.py
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://seha-medical-system-fmis.onrender.com
      - key: SECRET_KEY
        generateValue: true
