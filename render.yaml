services:
  - type: web
    name: seha-medical-system-kad36
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_combined.py
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
